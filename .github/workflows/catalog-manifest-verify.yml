name: catalog-manifest-verify

# PR-blocking. Recomputes catalog hashes and verifies the hybrid
# Ed25519 + ML-DSA-65 signature in catalog/MANIFEST.sig.json against the
# public keys listed in catalog/MAINTAINERS.md. No secrets needed; CI never
# sees the private signing key.
#
# While the signature is still the bootstrap placeholder (no maintainer key yet)
# the job enforces the hashes and warns about the missing signature. A real
# signature is always fully verified.

on:
  pull_request:
    paths:
      - 'catalog/**'
      - 'scripts/manifest.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/catalog-manifest-verify.yml'
  push:
    branches: [main]
    paths:
      - 'catalog/**'
      - 'scripts/manifest.mjs'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Hashes are always enforced. Until a maintainer key exists the signature is
      # a bootstrap placeholder: that is reported as a warning, not a failure.
      # Any non-placeholder signature is fully verified (Ed25519 + ML-DSA-65).
      - name: Verify manifest hashes and signature
        run: node scripts/manifest.mjs verify --allow-unsigned
